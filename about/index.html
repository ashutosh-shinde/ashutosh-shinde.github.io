  <!-- arriving from another page of the site: the quick flash starts with the first paint (.wq-arrive in
       site.css), and the page opens in the right place: a back link (data-back) returns to where you left
       this page; any other link opens it at the top, or at the #section it names -->
  <script>
    (function (e) {
      var go = location.hash ? location.hash.slice(1) : null, n, p, k = location.pathname.replace(/index\.html$/, "");
      try { var u = JSON.parse(sessionStorage.getItem("wq-unfold") || "null");
        if (u && Date.now() - u.t < 6000 && !matchMedia("(prefers-reduced-motion: reduce)").matches) { e.classList.add("wq-arrive"); e.style.setProperty("--fx", (u.x * 100).toFixed(1) + "%"); e.style.setProperty("--fy", (u.y * 100).toFixed(1) + "%"); }
        n = JSON.parse(sessionStorage.getItem("wq-nav") || "null");
        if (n && n.to == k && Date.now() - n.t < 10000) { sessionStorage.removeItem("wq-nav"); p = n.back != null && JSON.parse(sessionStorage.getItem("wq-pos:" + k) || "null");
          go = p && Math.abs(p.w - innerWidth) < 3 ? p.y : n.back != null ? n.back.slice(1) || 0 : go || 0; }
      } catch (x) {}
      if (go === null) return;
      var user = false, fixes = 0, place = function () { try { if (typeof go == "number") scrollTo(0, go); else { var t = document.getElementById(decodeURIComponent(go)); if (t) t.scrollIntoView(); } } catch (x) {} };
      e.style.scrollBehavior = "auto";
      ["wheel", "touchstart", "keydown", "pointerdown"].forEach(function (v) { addEventListener(v, function () { user = true; }, { capture: true, passive: true }); });
      document.addEventListener("readystatechange", function () { if (document.readyState == "interactive" && !user) place(); });
      addEventListener("load", function () { if (!user) place(); var end = Date.now() + 1500; // and keep it there until the visitor moves
        addEventListener("scroll", function hold() { if (user || Date.now() > end || ++fixes > 8) removeEventListener("scroll", hold); else place(); }, { passive: true });
        setTimeout(function () { e.style.scrollBehavior = ""; }, 300); });
    })(document.documentElement);
  </script>
